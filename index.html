<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Untukmu</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="card">

<div id="welcome">

<h1>Haiii 😊</h1>

<p>

Terima kasih sudah meluangkan waktu

untuk scan QR ini.

</p>

<p>

Tenang ya...

Website ini cuma berisi pesan kecil.

Tidak ada iklan.

Tidak ada login.

Tidak ada permintaan data apa pun.

</p>

<button onclick="start()">Buka Pesan 💛</button>

</div>

<div id="message">

<div id="typing"></div>

<div class="footer">

🌸

</div>

</div>

</div>

<script>

for(let i=0;i<80;i++){

let s=document.createElement("div");

s.className="star";

s.style.left=Math.random()*100+"vw";

s.style.top=Math.random()*100+"vh";

s.style.animationDelay=Math.random()*4+"s";

document.body.appendChild(s);

}

const lines=[

"Haiii... katanya hari yang melelahkan perlu sedikit energi tambahan. 😊",

"",

"Jadi... aku titip tiga snack kecil ini buat nemenin harimu. 🍫🥛🥢",

"",

"Semogaa kamu sukaa,",

"dan semogaaa harimu berjalan lebih ringan dan lancarrr.",

"",

"Ohhh iyaaa...",

"makasiii pulsanyaa pagi tadii ☺️",

"",

"Semoga hari ini menyenangkan yaa 🌸",

"",

"- Krisna -"

];

function sleep(ms){

return new Promise(r=>setTimeout(r,ms));

}

async function start(){

document.getElementById("welcome").style.display="none";

document.getElementById("message").style.display="block";

let box=document.getElementById("typing");

for(let text of lines){

let p=document.createElement("p");

box.appendChild(p);

for(let c of text){

p.innerHTML+=c;

await sleep(40);

}

await sleep(700);

}

confetti();

}

function confetti(){

for(let i=0;i<80;i++){

let c=document.createElement("div");

c.style.position="fixed";

c.style.left=Math.random()*100+"vw";

c.style.top="-20px";

c.style.width="8px";

c.style.height="8px";

c.style.background="hsl("+Math.random()*360+",100%,70%)";

c.style.borderRadius="50%";

c.style.transition="4s linear";

document.body.appendChild(c);

setTimeout(()=>{

c.style.transform="translateY(110vh) rotate(720deg)";

},10);

setTimeout(()=>{

c.remove();

},4200);

}

}

</script>

</body>
</html>
